name: Secure CI/CD Pipeline
# This workflow builds a Docker image, and performs security scans using Snyk.
# It is triggered on pushes and pull requests to the main branch.

on:
  push:
    branches: [ main ]
    paths:
    - 'Full Stack Web App CI CD Pipeline/**'
    - 'Full-Stack-Web-App-CI-CD-Pipeline/**'
  pull_request:
    branches: [ main ]
    paths:
    - 'Full Stack Web App CI CD Pipeline/**'
    - 'Full-Stack-Web-App-CI-CD-Pipeline/**'

jobs:
  build-and-test-ci:
    name: Build & Security Test Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Detect project directory
      run: |
        if [ -d "Full-Stack-Web-App-CI-CD-Pipeline" ]; then
          echo "PROJECT_DIR=Full-Stack-Web-App-CI-CD-Pipeline" >> $GITHUB_ENV
        elif [ -d "Full Stack Web App CI CD Pipeline" ]; then
          echo "PROJECT_DIR=Full Stack Web App CI CD Pipeline" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=" >> $GITHUB_ENV
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -z "$PROJECT_DIR" ]; then
          echo "No project directory found. Looking for requirements.txt at repo root..."
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping dependency install."
          fi
        else
          REQ="$PROJECT_DIR/requirements.txt"
          if [ -f "$REQ" ]; then
            pip install -r "$REQ"
          else
            echo "Requirements file not found at $REQ";
            ls -la "$PROJECT_DIR" || true;
            exit 1;
          fi
        fi

    - name: Install Snyk CLI
      run: npm install -g snyk

    - name: Authenticate Snyk
      run: snyk auth ${{ secrets.SNYK_TOKEN }}

    - name: Snyk Open Source Scan SCA
      run: |
        if [ -z "$PROJECT_DIR" ]; then
          echo "No project directory detected, attempting to run snyk against requirements.txt in repo root"
          if [ -f requirements.txt ]; then
            snyk test --file=requirements.txt --package-manager=pip
          else
            echo "No requirements.txt to scan"; exit 0;
          fi
        else
          snyk test --file="$PROJECT_DIR/requirements.txt" --package-manager=pip
        fi

    - name: Snyk Code Scan SAST
      run: |
        if [ -z "$PROJECT_DIR" ]; then
          snyk code test .
        else
          snyk code test "$PROJECT_DIR"
        fi

  docker-deployment-cd:
    name: Docker Deployment
    runs-on: ubuntu-latest
    needs: build-and-test-ci

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Detect project directory
      run: |
        if [ -d "Full-Stack-Web-App-CI-CD-Pipeline" ]; then
          echo "PROJECT_DIR=Full-Stack-Web-App-CI-CD-Pipeline" >> $GITHUB_ENV
        elif [ -d "Full Stack Web App CI CD Pipeline" ]; then
          echo "PROJECT_DIR=Full Stack Web App CI CD Pipeline" >> $GITHUB_ENV
        else
          echo "PROJECT_DIR=" >> $GITHUB_ENV
        fi

    - name: Log in to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: |
        if [ -z "$PROJECT_DIR" ]; then
          echo "No project directory detected; attempting to build from repo root"
          docker build -t sukhpreetsahi5/securecart-app:latest .
        else
          docker build -t sukhpreetsahi5/securecart-app:latest "$PROJECT_DIR"/
        fi

    - name: Push Docker image
      run: docker push sukhpreetsahi5/securecart-app:latest
