name: Secure CI/CD Pipeline
# Builds the web application and performs security scans using Snyk.
# Triggered when the SecureCart project changes.

on:
  push:
    branches: [ main ]
    paths:
      - 'securecart/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'securecart/**'

jobs:
  build-and-test-ci:
    name: Build & Security Test Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 'securecart/requirements.txt'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Open Source Scan SCA
        run: snyk test --file='securecart/requirements.txt' --package-manager=pip

      - name: Snyk Code Scan SAST
        run: snyk code test 'securecart'

  docker-deployment-cd:
    name: Docker Deployment
    runs-on: ubuntu-latest
    needs: build-and-test-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t sukhpreetsahi5/securecart-app:latest 'securecart/'

      - name: Push Docker image
        run: docker push sukhpreetsahi5/securecart-app:latest
